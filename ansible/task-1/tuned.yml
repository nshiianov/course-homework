- name: скачать и установить tuned
  hosts: myhosts
  become: true
  tasks:

   - name: убедиться, что tuned установлен последней версии
     ansible.builtin.apt:
        name: tuned
        state: latest

   - name: убедиться, что tuned запущен и работает в автозагрузке
     ansible.builtin.systemd_service:
        name: tuned
        state: started
        enabled: true
